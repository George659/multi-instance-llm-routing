workload:
  seed: 42
  num_requests: 200

  mix:
    chat: 0.5
    rag: 0.3
    agent: 0.2

  chat:
    prompt_words_min: 50
    prompt_words_max: 200
    max_tokens_min: 50
    max_tokens_max: 128

  rag:
    prompt_words_min: 500
    prompt_words_max: 1500
    max_tokens_min: 100
    max_tokens_max: 256
    shared_prefix_ratio: 0.5
    shared_prefix_words: 300
    num_prefix_groups: 4

  agent:
    prompt_words_min: 200
    prompt_words_max: 800
    max_tokens_min: 300
    max_tokens_max: 800
    num_task_templates: 4